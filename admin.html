
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }

        header {
            background: #173b70;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px 15px;
        }

        .card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            color: #173b70;
        }

        a {
            color: #173b70;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
    <p>Training & Placement Cell Management</p>
</header>

<section class="dashboard">

    <div class="card">
        <h2>Students</h2>
        <p>Manage student records</p>
        <a href="#">View Students</a>
    </div>

    <div class="card">
        <h2>Companies</h2>
        <p>Manage registered companies</p>
        <a href="#">View Companies</a>
    </div>

    <div class="card">
        <h2>Placement Drives</h2>
        <p>Manage placement opportunities</p>
        <a href="#">View Drives</a>
    </div>

    <div class="card">
        <h2>Applications</h2>
        <p>Check student applications</p>
        <a href="#">View Applications</a>
    </div>

</section>

<p style="text-align:center;">
    <a href="index.html">Back to Home</a>
</p>

</body>
</html>

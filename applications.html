<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Applications</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 20px;
        }
        .application-form {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0002;
        }
        .application-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        .application-form input,
        .application-form select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .application-form button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #173b68;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .application-form button:hover {
            background: #2878c8;
        }
        #message {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-top: 18px;
        }
        .note {
            background: #eaf1fa;
            padding: 12px;
            border-radius: 8px;
            color: #173b68;
        }
    </style>
</head>
<body>
<header>
    <h1>Training and Placement Cell</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="student.html">Student</a>
        <a href="drives.html">Placement Drives</a>
    </nav>
</header>
<main class="container">
    <h2>Student Application Form</h2>
    <p>Fill in your details to apply for a placement drive.</p>
    <form class="application-form" id="applicationForm">
        <label for="name">Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your full name" required>
        <label for="email">Email Address</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>
        <label for="course">Course</label>
        <input type="text" id="course"
               placeholder="Example: B.Sc. Computer Science" required>
        <label for="cgpa">Current CGPA</label>
        <input type="number" id="cgpa"
               min="0" max="10" step="0.01"
               placeholder="Enter your CGPA" required>
        <label for="company">Select Company</label>
        <select id="company" required>
            <option value="">Choose Company</option>
            <option value="TCS">TCS</option>
            <option value="Infosys">Infosys</option>
            <option value="Wipro">Wipro</option>
            <option value="Accenture">Accenture</option>
            <option value="Capgemini">Capgemini</option>
            <option value="Tech Mahindra">Tech Mahindra</option>
        </select>
        <label for="resume">Upload Resume (PDF)</label>
        <input type="file" id="resume"
               accept=".pdf,application/pdf" required>
        <p class="note">
            Please select your resume in PDF format.
            This demo does not upload or store the file.
        </p>
        <button type="submit">Submit Application</button>
        <p id="message"></p>
    </form>
</main>
<script>
document.getElementById("applicationForm")
.addEventListener("submit", function(event) {
    event.preventDefault();
    const resume = document.getElementById("resume").files[0];
    if (!resume || resume.type !== "application/pdf") {
        document.getElementById("message").textContent =
            "Please select a valid PDF resume.";
        return;
    }
    document.getElementById("message").textContent =
        "Demo application submitted successfully!";
    this.reset();
});
</script>
</body>
</html>

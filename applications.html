
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Placement Application Form</h1>
        <p>Apply for your dream job</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="drives.html">Placement Drives</a>
        <a href="companies.html">Companies</a>
    </nav>

    <main class="container">

        <div class="card">
            <h2>Student Application</h2>

            <form onsubmit="return validateApplication()">

                <label>Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label>Course</label>
                <select required>
                    <option value="">Select Course</option>
                    <option>B.Sc Computer Science</option>
                    <option>BCA</option>
                    <option>B.Tech</option>
                    <option>BBA</option>
                </select>

                <label>Company</label>
                <select required>
                    <option value="">Select Company</option>
                    <option>TCS</option>
                    <option>Infosys</option>
                    <option>Wipro</option>
                </select>

                <label>CGPA</label>
                <input type="number" step="0.01" min="0" max="10"
                       placeholder="Enter your CGPA" required>

                <button type="submit">Submit Application</button>

            </form>

            <p><a href="drives.html">Back to Placement Drives</a></p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>

<script>
const form = document.getElementById("registerForm");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");

    const student = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        course: document.getElementById("course").value.trim(),
        password: document.getElementById("password").value,
        cgpa: Number(document.getElementById("cgpa").value) || 0
    };

    message.textContent = "Registering...";

    try {
        const response = await fetch(
            "https://training-placement-system.onrender.com/api/auth/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            }
        );

        const raw = await response.text();
        let result;

        try {
            result = JSON.parse(raw);
        } catch {
            result = { message: raw };
        }

        message.textContent =
            result.message || "Server response: " + response.status;

        if (response.ok) {
            form.reset();
        }

    } catch (error) {
        message.textContent = "Network error: " + error.message;
    }
});
</script>

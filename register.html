<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Training and Placement Cell</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <h2>Student Registration</h2>

    <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Course</label>
        <input type="text" id="course" placeholder="BSc Computer Science" required>

        <label>Password</label>
        <input type="password" id="password" minlength="6" required>

        <label>CGPA</label>
        <input type="number" id="cgpa" min="0" max="10" step="0.01">

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>
</main>

<script>
const form = document.getElementById("registerForm");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");

    const student = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        course: document.getElementById("course").value.trim(),
        password: document.getElementById("password").value,
        cgpa: Number(document.getElementById("cgpa").value) || 0
    };

    message.textContent = "Registering...";

    try {
        const response = await fetch(
            "https://training-placement-system-api.onrender.com/api/auth/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            }
        );

        const result = await response.json();

        message.textContent = result.message;

        if (response.ok) {
            form.reset();
        }

    } catch (error) {
        message.textContent = "Connection error. Please try again.";
    }
});
</script>

</body>
</html>

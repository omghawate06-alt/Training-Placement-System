
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Reports</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }

        header {
            background: #173b70;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 25px auto;
            padding: 15px;
        }

        .report {
            background: white;
            padding: 22px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #173b70;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
            color: #173b70;
        }

        a {
            color: #173b70;
        }
    </style>
</head>

<body>

<header>
    <h1>Placement Reports</h1>
    <p>Student Placement Statistics</p>
</header>

<div class="container">

    <div class="report">
        <h2>Total Registered Students</h2>
        <p class="number">250</p>
    </div>

    <div class="report">
        <h2>Companies Visited</h2>
        <p class="number">15</p>
    </div>

    <div class="report">
        <h2>Students Placed</h2>
        <p class="number">120</p>
    </div>

    <div class="report">
        <h2>Placement Percentage</h2>
        <p class="number">48%</p>
    </div>

    <p><a href="admin.html">Back to Admin Dashboard</a></p>
    <p><a href="index.html">Back to Home</a></p>

</div>

</body>
</html>
